<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDDY TEMPLAR | Technical Outerwear</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-heavy {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .text-outline {
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
      color: transparent;
    }
    .grayscale-img {
      filter: grayscale(100%) contrast(110%);
      transition: filter 0.5s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .grayscale-img:hover {
      filter: grayscale(0%) contrast(100%);
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 20s linear infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealZoom {
      0% { opacity: 0; transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes viewTransition {
      0% { opacity: 0; transform: translateY(30px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 1s ease-out forwards;
    }
    .animate-reveal {
      animation: revealZoom 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .view-transition-container {
      animation: viewTransition 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    
    .filter-accordion {
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      overflow: hidden;
    }

    .et-logo-placeholder {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      background: linear-gradient(135deg, #333 0%, #000 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .et-logo-placeholder::after {
      content: 'e.T';
      font-size: 2rem;
      letter-spacing: -0.1em;
    }

    /* Custom scroll parallax helper */
    .parallax-inner {
      will-change: transform;
      transform: translateY(var(--parallax-y, 0));
    }

    /* Input focus styles */
    .footer-input-focus:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }
  </style>
